<title>Carnet de famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Layout : nuit bleu-violet profonde, panneaux et boutons en verre façon Apple.
   Téléphone : barre du haut (logo S, recherche, cloche, membres), titre de la rubrique, personnes,
   dossiers en tuiles pastel, barre d'onglets en verre en bas. Tablette/ordinateur : barre latérale. */
:root{
  color-scheme:dark;
  --bg:#0A1150; --bg-2:#141B6B;
  --ink:#F4F6FF; --ink-2:rgba(226,231,255,.78); --ink-3:rgba(200,208,255,.55);
  --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.22);
  --blue:#3E73FF; --blue-hi:#7FA6FF; --violet:#8B6BFF; --lilac:#C9B8FF;
  --late:#FF7A8A; --late-bg:rgba(255,122,138,.16); --soon:#FFC56B; --soon-bg:rgba(255,197,107,.16); --ok:#6FE3B4;
  --f:"Plus Jakarta Sans",-apple-system,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --r:22px;
  /* Verre Apple */
  --glass:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.06));
  --glass-b:rgba(255,255,255,.24);
  --glass-sh:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.06),0 10px 28px rgba(4,8,60,.38);
  --panel:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.045));
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(70% 45% at 85% 0%,rgba(139,107,255,.55),transparent 70%),
    radial-gradient(60% 40% at 0% 25%,rgba(62,115,255,.45),transparent 70%),
    radial-gradient(70% 50% at 100% 70%,rgba(110,80,240,.35),transparent 70%),
    radial-gradient(80% 50% at 10% 100%,rgba(40,90,255,.4),transparent 70%),
    linear-gradient(160deg,#0D1868 0%,#0A1150 55%,#170F5E 100%);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}
img{max-width:100%}

/* ---------- Matières ---------- */
.glass{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);color:var(--ink)}
.primary{background:linear-gradient(180deg,#6E98FF 0%,#3E73FF 45%,#2B57E6 100%);border:1px solid rgba(175,200,255,.65);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(10,30,140,.35),0 10px 26px rgba(46,90,255,.5);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.glass:active,.primary:active{transform:scale(.97)}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 18px 40px rgba(4,8,60,.35);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%)}

/* ---------- Structure ---------- */
.app{max-width:1240px;margin:0 auto;display:block}
.side{display:none}
.main{min-width:0;padding-inline:16px;padding-block:12px 130px}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;padding:20px 24px}
  .main{padding:4px 0 60px}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:20px;height:calc(100vh - 40px);border-radius:30px;padding:24px 14px 16px}
  .tabbar{display:none!important}
  .brand.m{display:none!important}
}

/* Marque */
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-s{width:auto;height:46px;flex:none;filter:drop-shadow(0 4px 10px rgba(20,20,120,.5))}
.brand span{font-weight:800;font-size:1.28rem;line-height:1.08;letter-spacing:-.01em}
.side .brand{padding:0 10px 18px}

/* Barre latérale */
.side-nav{display:grid;gap:4px}
.side-item{display:flex;align-items:center;gap:13px;width:100%;min-height:50px;padding:0 14px;border-radius:16px;border:1px solid transparent;background:none;color:var(--ink-2);font-weight:600;font-size:.98rem;text-align:left}
.side-item svg{width:22px;height:22px;flex:none}
.side-item:hover{background:rgba(255,255,255,.06)}
.side-item[aria-pressed="true"]{background:linear-gradient(180deg,rgba(150,175,255,.55),rgba(110,140,255,.35));border-color:rgba(200,215,255,.5);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px rgba(30,50,180,.35)}
.side-item .dot{width:8px;height:8px;border-radius:50%;background:var(--c);margin-left:auto;flex:none}
.side-item.add{color:var(--blue-hi)}
.side hr{border:0;height:1px;background:var(--line);margin:12px 10px}
.side-foot{margin-top:auto;display:grid;gap:4px}
.side-foot .side-item .chev{margin-left:auto;width:18px;height:18px}

/* Barre du haut */
.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand actions" "search search";gap:12px;align-items:center}
.topbar .brand{grid-area:brand}
.top-actions{grid-area:actions;display:flex;gap:10px}
.search{grid-area:search}
.datepill{display:none}
@media (min-width:900px){
  .topbar{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"date search actions";border-radius:26px;padding:8px}
  .datepill{display:flex;align-items:center;grid-area:date;height:50px;padding:0 20px;border-radius:18px;font-weight:600;white-space:nowrap}
}
.icon-btn{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.icon-btn .pip{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px rgba(10,17,80,.8),0 0 10px var(--ok)}
.search{position:relative;border-radius:999px}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink-2);pointer-events:none}
.search input{width:100%;height:50px;border:0;background:transparent;padding:0 46px 0 50px;font-size:1rem;color:var(--ink);border-radius:999px;outline-offset:-2px}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{position:absolute;right:7px;top:7px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:var(--ink);font-size:1.15rem;line-height:1}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;color:var(--ink-3);margin:10px 4px 0}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)} .sync.warn i{background:var(--soon)}

/* En-tête de page */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 18px;margin-top:22px}
.hero-text{min-width:0;flex:1 1 260px}
.eyebrow{font-size:.82rem;font-weight:600;color:var(--ink-3);margin:0 0 4px}
@media (min-width:900px){.hero .eyebrow{display:none}}
.hero h1{margin:0;font-weight:800;font-size:clamp(2rem,7.4vw,3.1rem);line-height:1.04;letter-spacing:-.03em;text-wrap:balance;overflow-wrap:anywhere}
.hero p{margin:6px 0 0;color:var(--ink-2);font-size:1.02rem}
.hero-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:1 1 100%}
@media (min-width:640px){.hero-actions{display:flex;flex:none}}
.hero-actions .btn{min-height:50px;padding:0 20px;border-radius:999px;font-size:1rem}

/* Boutons */
.btn{min-height:52px;border-radius:18px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;color:var(--ink);font-size:.98rem;text-align:center;line-height:1.2}
.btn svg{width:20px;height:20px;flex:none}
.btn.danger{color:var(--late);border-color:rgba(255,122,138,.45)}
.btn.danger.armed{background:linear-gradient(180deg,#FF8A98,#E5475C);color:#fff;border-color:rgba(255,190,200,.6)}
.btn[disabled]{opacity:.5;pointer-events:none}

/* Personnes */
.tools{margin:18px 0 6px}
.chips{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:4px 4px 8px;margin:0 -4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x pan-y;scroll-snap-type:x proximity;scroll-padding-inline:8px;cursor:grab;user-select:none;-webkit-user-select:none;
  --fl:0px;--fr:0px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%)}
.chips.more-l{--fl:22px}.chips.more-r{--fr:30px}
.chips.dragging{cursor:grabbing;scroll-snap-type:none}
.chips::-webkit-scrollbar{display:none}
.chips>*{scroll-snap-align:start}
.chip{flex:none;display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 8px;border-radius:999px;font-weight:600;font-size:.98rem;white-space:nowrap}
.chip.noav{padding-left:20px}
.chip .av{width:36px;height:36px;font-size:.95rem}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(226,232,255,.9));color:#14206A;border-color:rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 10px 26px rgba(10,20,90,.4)}
.chip.add{color:var(--ink)}
.chip.add .plusav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
.chip.add svg{width:18px;height:18px}

/* Avatars */
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff;flex:none;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),transparent 55%),var(--m,#6474C8);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 8px rgba(0,0,0,.25)}
.av.fam{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.4),transparent 55%),linear-gradient(180deg,#5D72D8,#3346A8)}
.av.fam svg{width:58%;height:58%}
.chip[aria-pressed="true"] .av.fam{background:linear-gradient(180deg,#2B3B9C,#1A2675)}

/* Barre d'onglets (téléphone) */
.tabbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:30px;padding:6px}
.tabs{gap:4px;padding:0;margin:0}
.tab{flex:none;min-width:76px;height:60px;padding:0 10px;border-radius:24px;border:1px solid transparent;background:none;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:700;white-space:nowrap}
.tab svg{width:23px;height:23px}
.tab .tc{color:var(--c,currentColor)}
.tab[aria-pressed="true"]{color:#14206A;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(226,232,255,.88));border-color:#fff;box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(10,20,90,.35)}
.tab[aria-pressed="true"] .tc{color:#14206A}
.tab.add{color:var(--blue-hi)}

/* Alertes */
.alerts{margin-top:16px;border-radius:var(--r);padding:16px 16px 8px;position:relative;overflow:hidden}
.alerts::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 120% at 0% 0%,rgba(255,170,120,.18),transparent 60%);pointer-events:none}
.alerts h2{position:relative;font-weight:800;font-size:1.12rem;margin:0 0 6px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
.alerts h2 .count{background:linear-gradient(180deg,#FF95A2,#F0566B);color:#fff;border-radius:999px;font-size:.76rem;padding:2px 9px;box-shadow:0 4px 10px rgba(240,86,107,.4)}
.alert-row{position:relative;display:flex;align-items:center;gap:12px;padding:11px 0;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;color:var(--ink)}
.alert-row:first-of-type{border-top:0}
.alert-row .dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.alert-row .t{flex:1;min-width:0}
.alert-row .t b{display:block;font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.alert-row .t span{font-size:.85rem;color:var(--ink-2)}
.tag{font-size:.78rem;font-weight:700;border-radius:999px;padding:5px 11px;white-space:nowrap;flex:none}
.tag.late{background:var(--late-bg);color:var(--late);border:1px solid rgba(255,122,138,.35)}
.tag.soon{background:var(--soon-bg);color:var(--soon);border:1px solid rgba(255,197,107,.35)}

/* Dossiers (tuiles) */
.folders-wrap{margin-top:8px}
.folders{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:640px){.folders{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}}
.folder{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;min-height:96px;padding:16px 18px;border-radius:24px;text-align:left;
  border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 14px 30px rgba(6,10,70,.35);color:#10184F}
.folder::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;bottom:-170px;background:rgba(255,255,255,.16);pointer-events:none}
.folder::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 45%);pointer-events:none}
.folder:active{transform:scale(.985)}
.folder.t0{background:linear-gradient(120deg,#E3F2FF,#AFD8FB)}
.folder.t1{background:linear-gradient(120deg,#2E4BD6,#4A63E8);color:#fff}
.folder.t2{background:linear-gradient(120deg,#DCD0FF,#AE97F2)}
.folder.t3{background:linear-gradient(120deg,#FBE5F6,#D9C9F7)}
.folder.t4{background:linear-gradient(120deg,#4C5FC4,#6A7AD8);color:#fff}
.folder.t5{background:linear-gradient(120deg,#2C5CFF,#3F44D9);color:#fff}
.ficon{position:relative;z-index:1;width:56px;height:56px;border-radius:17px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 14px rgba(10,20,90,.15);color:#18235E}
.folder.t1 .ficon,.folder.t4 .ficon,.folder.t5 .ficon{background:rgba(10,20,110,.35);border-color:rgba(255,255,255,.28);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.ficon svg{width:27px;height:27px}
.ftext{position:relative;z-index:1;flex:1;min-width:0;display:grid;gap:3px}
.fname{font-weight:800;font-size:1.12rem;line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}
.fmeta{font-size:.92rem;opacity:.72;font-weight:500}
.fmeta b{font-weight:700;opacity:1}
.fmeta b.late{color:#C2213A} .fmeta b.soon{color:#9A5A00}
.folder.t1 .fmeta b.late,.folder.t4 .fmeta b.late,.folder.t5 .fmeta b.late{color:#FFC0C8}
.folder.t1 .fmeta b.soon,.folder.t4 .fmeta b.soon,.folder.t5 .fmeta b.soon{color:#FFE0A6}
.favs{display:flex;margin-top:4px}
.favs .av{width:24px;height:24px;font-size:.62rem;margin-right:-6px;border:2px solid rgba(255,255,255,.75)}
.chev{position:relative;z-index:1;width:22px;height:22px;flex:none;opacity:.85}
.folder.loose{border-style:dashed}
.folder.add{background:rgba(255,255,255,.04);border:1.5px dashed rgba(255,255,255,.45);box-shadow:none;color:var(--ink)}
.folder.add::before,.folder.add::after{display:none}
.folder.add .ficon{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3);color:#fff;box-shadow:none}
.folder.add .fmeta{opacity:.7}

/* Échéances (liste) */
.group{margin-top:22px}
.group h3{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin:0 0 10px 6px;display:flex;align-items:center;gap:10px}
.group h3::after{content:"";flex:1;height:1px;background:var(--line)}
.group h3 .n{order:2;color:var(--ink-2)}
.group.late h3{color:var(--late)}
.list{display:grid;gap:12px}
@media (min-width:1100px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;border-radius:var(--r);padding:16px;text-align:left;width:100%;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 14px 32px rgba(4,8,60,.3);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.card:active{transform:scale(.99)}
.card .main{min-width:0;display:grid;gap:7px;padding:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;border-radius:999px;padding:4px 10px;max-width:100%;min-width:0;line-height:1.3;
  background:color-mix(in srgb,var(--c) 24%,transparent);color:color-mix(in srgb,var(--c) 45%,#fff);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.pill svg{width:14px;height:14px;flex:none}
.pill .pt{min-width:0;overflow-wrap:anywhere}
.pill.sub{background:rgba(255,255,255,.08);border-color:var(--line-2);color:var(--ink-2)}
.ex{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.1);color:var(--ink-2);border-radius:999px;padding:3px 8px;align-self:center}
.card .subj{font-weight:800;font-size:1.1rem;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.card .who{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--ink-2);flex-wrap:wrap}
.card .who .av{width:24px;height:24px;font-size:.66rem}
.card .meta{font-size:.84rem;color:var(--ink-3)}
.card .note{font-size:.88rem;color:var(--ink-2);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.datebox{width:70px;border-radius:18px;display:grid;place-items:center;align-content:center;padding:9px 4px 8px;text-align:center;align-self:start;font-variant-numeric:tabular-nums;color:#fff;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 80%,#fff 15%),color-mix(in srgb,var(--c) 70%,#1B1F8A 30%));border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 18px color-mix(in srgb,var(--c) 35%,transparent)}
.datebox .d{font-weight:800;font-size:1.75rem;line-height:1;letter-spacing:-.02em}
.datebox .m{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.datebox .y{font-size:.66rem;opacity:.85}
.datebox.none{background:rgba(255,255,255,.08);color:var(--ink-3);border-color:var(--line);box-shadow:none}
.rel{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;border-top:1px solid var(--line);padding-top:10px;font-size:.86rem;color:var(--ink-2)}
.rel b{font-weight:700;color:var(--ink)}
.rel .late{color:var(--late)} .rel .soon{color:var(--soon)}
.rel .bell{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink-3)}
.rel .bell svg{width:14px;height:14px}
.none{color:var(--ink-3);text-align:center;margin:26px 0 0;font-size:.98rem}

/* Sous-dossier */
.subview{margin-top:10px}
.subhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.subtitle{flex:1;min-width:0}
.subtitle .eyebrow{color:var(--ink-3);margin:0;text-transform:none}
.subtitle h2{font-weight:800;font-size:1.7rem;line-height:1.1;letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
.danger-ic{color:var(--late)}
.mgroup{margin-top:18px;display:grid;gap:10px}
.mgroup h3{display:flex;align-items:center;gap:10px;margin:0 4px;font-size:1.02rem;font-weight:700}
.mgroup h3 .av{width:30px;height:30px;font-size:.78rem}
.mgroup h3 .n{margin-left:auto;font-size:.82rem;color:var(--ink-3)}
.rowbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.addline{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:18px;border:1.5px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.04);color:var(--ink);font-weight:600;font-size:.9rem;padding:4px 8px;gap:6px;flex-wrap:wrap;min-width:0;text-align:center}
.addline svg{width:18px;height:18px;color:var(--blue-hi);flex:none}

/* Sous-dossiers : communs à tous les membres de la famille */
const subsOf = k => Array.isArray(k.subs) ? k.subs : ((DEFAULT_CATS.find(d=>d.id===k.id)||{}).subs || []).map(x=>Object.assign({},x));
const stem = l => norm(l).replace(/[^a-z ]/g,'').split(' ').filter(Boolean)[0]?.slice(0,6) || '';
function subOf(c){

  return list.find(x=>{ const st=stem(x.label); return st.length>=4 && t.includes(st); }) || null;
}
async function addSub(catId, label){
  const k = cats.find(c=>c.id===catId); if(!k) return null;

  const list = subsOf(k);

}
const MEMBER_COLORS = ['#2F6BFF','#FF9A1F','#E8336E','#A04BE8','#14B8A6','#F05A3A','#5B5BEA','#7C8BA8'];
const OLD_COLORS = {'#3F8F68':'#14B8A6','#C4604E':'#FF9A1F','#5F8DB8':'#2F6BFF','#C4913F':'#F05A3A','#8A6BB8':'#A04BE8','#3E9C93':'#14B8A6','#A7563A':'#E8336E','#6E7F76':'#7C8BA8',

  {id:'m1',name:'Père',color:'#2F6BFF'},

  [null,'Pas de rappel'],[0,'Le jour même'],[1,'La veille'],[3,'3 jours avant'],

];
const FAM_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>';

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const todayISO = () => iso(new Date());
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const addMonths = (s,n) => { const d=parse(s); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return iso(d); };

const MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const shortDate = s => { const d=parse(s); return d.getDate()+' '+MONTHS[d.getMonth()]; };
const fmt = s => { const d=parse(s); return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear(); };
const longDate = s => parse(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
function relLabel(n){
  if(n===0) return "aujourd'hui";
  if(n===1) return 'demain';
  if(n===-1) return 'hier';
  const a=Math.abs(n); let t;
  if(a>=360 && a<=370) t='1 an'; else if(a<32) t=a+' jours'; else if(a<60) t=Math.round(a/7)+' semaines'; else if(a<730) t=Math.round(a/30.4)+' mois'; else t=Math.round(a/365)+' ans';
  return n>0 ? 'dans '+t : 'il y a '+t;
}
const hasRemind = c => !(c.remindDays===null||c.remindDays===undefined||c.remindDays==='');
function status(card, today){
  if(!card.nextDate) return {kind:'none'};
  const n = diffDays(today, card.nextDate);
  if(n<0) return {kind:'late', n};
  if(hasRemind(card) && n<=Number(card.remindDays)) return {kind:'remind', n};
  return {kind:'later', n};
}

/* ---------- État ---------- */
let members = DEFAULT_MEMBERS.slice();

const LS_KEY = 'carnet-famille-v1', LS_UI = 'carnet-famille-ui', LS_SET = 'carnet-famille-settings';
const lsGet = (k,d) => { try{ const v=JSON.parse(localStorage.getItem(k)||'null'); return v==null?d:v; }catch(e){ return d; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };
const ui = lsGet(LS_UI, null); if(ui){ filters.person = ui.person===FAMILY ? 'all' : (ui.person||'all'); filters.cat = ui.cat||'all'; }

const avatar = m => m.id===FAMILY ? `<span class="av fam">${FAM_SVG}</span>` : `<span class="av" style="--m:${esc(freshColor(m.color))}">${esc((m.name||'?').trim().charAt(0).toUpperCase())}</span>`;

const queues = {};

function localSave(){ if(!lsSet(LS_KEY,{members,cats,cards,hist})) toast("Impossible d'enregistrer sur ce téléphone."); }

async function persistCard(card){
  cards[card.id]=card; render(); schedulePushSync();
  if(mode==='cloud'){ await ensureMembers(); return queued(card.id,()=>col.doc(card.id).set(Object.assign({kind:'fiche'},card))).catch(()=>toast("L'enregistrement a échoué. Réessayez.")); }
  localSave();
}
/* Historique : une liste de dates passées par personne + rubrique + sous-dossier */
const histKey = (m,c,sb) => m+'|'+c+'|'+(sb||'');
function histFor(m,c,sb){ const k=histKey(m,c,sb); return Object.values(hist).filter(h=>histKey(h.memberId,h.cat,h.sub)===k).sort((a,b)=>b.date.localeCompare(a.date)); }
function lastOf(c){ const h=histFor(c.memberId,c.cat,subOf(c)?.id); return [c.lastDate,h[0]&&h[0].date].filter(Boolean).sort().pop()||''; }
async function persistHist(e){
  hist[e.id]=e; render();

}
async function removeHist(id){

}
async function ensureHist(m,c,sb,date){
  if(!date || date>todayISO() || histFor(m,c,sb).some(h=>h.date===date)) return;
  await persistHist({id:'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),memberId:m,cat:c,sub:sb||'',date,note:''});
}

  membersSaved=true; render(); schedulePushSync();

}
async function ensureMembers(){ if(!membersSaved) await persistMembers(); }

async function initStore(){
  let db=null, user=null, id=null;
  try{
    if(window.claude && typeof window.claude.use==='function'){
      [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if(db && user) id = await user.id();
    }
  }catch(e){ db=null; }
  if(db && id){
    col = db.collection('data/users/'+id);
    mode='cloud'; setSync();
    col.onSnapshot(snap=>{
      const next={}, nextH={}; let mem=null;
      snap.docs.forEach(d=>{ const v=d.data(); if(!v) return;
        if(d.id==='_membres') mem=v.list;
        else if(d.id==='_rubriques'){ if(v.list && v.list.length){ cats=renameOld(v.list); catsSaved=true; } }
        else if(v.kind==='fiche'){ const c=Object.assign({},v); delete c.kind; c.id=d.id; next[d.id]=c; }
        else if(v.kind==='hist'){ const h=Object.assign({},v); delete h.kind; h.id=d.id; nextH[d.id]=h; } });
      cards=next; hist=nextH; if(mem && mem.length){ members=mem; membersSaved=true; }
      render();
    }, ()=>{ mode='local'; localLoad(); setSync("Connexion perdue — affichage sur cet appareil"); render(); });
  } else {
    mode='local'; localLoad(); setSync(); render();
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    if(settings.pushOn) schedulePushSync(true);
  }
}
function setSync(msg){
  const el=document.getElementById('sync');
  el.className='sync '+(mode==='cloud'||mode==='local'?'ok':'warn');
  el.querySelector('span').textContent = msg || (mode==='cloud' ? 'Aperçu · espace privé' : 'Enregistré sur ce téléphone');
}

/* ---------- Rendu ---------- */
function filtered(){
  const q = norm(filters.q).trim();

    if(filters.person!=='all' && c.memberId!==filters.person) return false;

function updateFades(el){
  const max=el.scrollWidth-el.clientWidth;

}
function revealPressed(el){ const b=el.querySelector('[aria-pressed="true"]'); if(!b) return;
  const l=b.offsetLeft-el.offsetLeft, r=l+b.offsetWidth;
  if(l<el.scrollLeft+8) el.scrollTo({left:Math.max(0,l-24),behavior:'smooth'});
  else if(r>el.scrollLeft+el.clientWidth-8) el.scrollTo({left:r-el.clientWidth+34,behavior:'smooth'}); }
/* Glisser au doigt (natif) et à la souris */
function dragScroll(el){
  let down=false, sx=0, sl=0, moved=false;
  el.addEventListener('scroll',()=>updateFades(el),{passive:true});
  el.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse' || e.button!==0) return; down=true; moved=false; sx=e.clientX; sl=el.scrollLeft; });
  window.addEventListener('pointermove',e=>{ if(!down) return; const dx=e.clientX-sx; if(!moved && Math.abs(dx)>5){ moved=true; el.classList.add('dragging'); } if(moved) el.scrollLeft=sl-dx; });
  window.addEventListener('pointerup',()=>{ if(!down) return; down=false; el.classList.remove('dragging'); });
  el.addEventListener('click',e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } },true);
  el.addEventListener('wheel',e=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX) && el.scrollWidth>el.clientWidth){ el.scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});
}

/* Liste + ajout de dates passées (utilisé dans la fiche et dans la feuille Historique) */
function mountHist(el, getKey, onAdded){
  el.innerHTML = `<div class="hlist"></div>
    <div class="histadd"><label class="sr">Date du rendez-vous passé</label><input type="date" class="hDate" max="${todayISO()}">
      <label class="sr">Note</label><input class="hNote" maxlength="120" placeholder="Note (facultatif)">
      <button type="button" class="btn primary hAdd">${PLUS}Ajouter cette date</button></div>`;
  let editing=null;   // id de la date en cours de modification
  const draw=()=>{ const {m,c,sb}=getKey(); const l=histFor(m,c,sb);
    el.querySelector('.hlist').innerHTML = l.length ? l.map(h=> h.id===editing
      ? `<div class="hrow editing"><div class="hedit">
          <label class="sr" for="he-d">Date</label><input type="date" id="he-d" class="heDate" max="${todayISO()}" value="${esc(h.date)}">
          <label class="sr" for="he-n">Note</label><input id="he-n" class="heNote" maxlength="120" placeholder="Note (facultatif)" value="${esc(h.note)}">
          <div class="hbtns"><button type="button" class="btn primary" data-hsave="${esc(h.id)}">Enregistrer</button><button type="button" class="btn glass" data-hcancel="1">Annuler</button><button type="button" class="btn glass danger" data-hdel="${esc(h.id)}">${TRASH}</button></div>
        </div></div>`
      : `<button type="button" class="hrow" data-hedit="${esc(h.id)}" aria-label="Modifier la date du ${fmt(h.date)}"><span class="hd">${fmt(h.date)}</span><span class="hn">${h.note?esc(h.note):'<i>Ajouter une note</i>'}</span><span class="hpen">${PEN}</span></button>`).join('')
      : '<p class="hint" style="margin:0">Aucune date passée pour l\'instant.</p>'; };
  /* Garde la « dernière date » des fiches en accord avec l'historique corrigé */
  const syncLast=async (m,c,sb,oldDate)=>{
    const latest=(histFor(m,c,sb)[0]||{}).date||'';
    for(const card of Object.values(cards)){
      if(card.memberId===m && card.cat===c && (subOf(card)?.id||'')===(sb||'') && card.lastDate===oldDate && card.lastDate!==latest)
        await persistCard(Object.assign({},card,{lastDate:latest}));
    }
  };
  el.addEventListener('click', async e=>{
    const ed=e.target.closest('[data-hedit]');
    if(ed){ editing=ed.dataset.hedit; draw(); const i=el.querySelector('.heNote'); i && i.focus(); return; }
    if(e.target.closest('[data-hcancel]')){ editing=null; draw(); return; }
    const sv=e.target.closest('[data-hsave]');
    if(sv){
      const h=hist[sv.dataset.hsave]; if(!h){ editing=null; draw(); return; }
      const v=el.querySelector('.heDate').value, note=el.querySelector('.heNote').value.trim();
      if(!v){ el.querySelector('.heDate').focus(); toast('Choisissez une date'); return; }
      if(v>todayISO()){ toast('Date dans le futur : utilisez « Prochaine échéance »'); return; }
      if(histFor(h.memberId,h.cat,h.sub).some(x=>x.id!==h.id && x.date===v)){ toast('Cette date est déjà dans l\'historique'); return; }
      const old=h.date;
      await persistHist(Object.assign({},h,{date:v,note,updatedAt:new Date().toISOString()}));
      if(old!==v) await syncLast(h.memberId,h.cat,h.sub,old);
      editing=null; draw(); onAdded && onAdded(v); toast('Date modifiée'); return;
    }
    const d=e.target.closest('[data-hdel]');
    if(d){ if(!d.classList.contains('armed')){ d.classList.add('armed'); d.textContent='Confirmer'; return; }
      const h=hist[d.dataset.hdel]; await removeHist(d.dataset.hdel); if(h) await syncLast(h.memberId,h.cat,h.sub,h.date);
      editing=null; draw(); toast('Date supprimée'); return; }
    if(e.target.closest('.hAdd')){
      const di=el.querySelector('.hDate'), ni=el.querySelector('.hNote'), v=di.value;
      if(!v){ di.focus(); toast('Choisissez une date'); return; }
      if(v>todayISO()){ toast('Date dans le futur : utilisez « Prochaine échéance »'); return; }
      const {m,c,sb}=getKey();
      if(histFor(m,c,sb).some(h=>h.date===v)){ toast('Cette date est déjà dans l\'historique'); return; }
      await persistHist({id:'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),memberId:m,cat:c,sub:sb||'',date:v,note:ni.value.trim()});

/* ---------- Notifications push ---------- */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const isStandalone = () => window.navigator.standalone===true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
const permission = () => (typeof Notification!=='undefined' ? Notification.permission : 'unsupported');
function pushState(){
  if(mode==='cloud' || window.claude) return {kind:'preview'};
  if(!CONFIG.workerUrl) return {kind:'noconfig'};
  if(isIOS && !isStandalone()) return {kind:'install'};
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || typeof Notification==='undefined') return {kind:'unsupported'};
  return {kind:'ready'};
}
const b64uToBytes = s => { s=s.replace(/-/g,'+').replace(/_/g,'/'); const bin=atob(s+'==='.slice((s.length+3)%4)); return Uint8Array.from(bin,c=>c.charCodeAt(0)); };
const bytesEq = (a,b) => { if(!a||!b||a.byteLength!==b.byteLength) return false; const x=new Uint8Array(a), y=new Uint8Array(b); return x.every((v,i)=>v===y[i]); };
const api = (path, body) => fetch(CONFIG.workerUrl.replace(/\/$/,'')+path, body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {}).then(async r=>{ const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||('Erreur '+r.status)); return j; });

function buildReminders(){
  const out=[], now=Date.now(), horizon=now+400*864e5, h=Number(settings.hour)||9;
  const at = s => { const d=parse(s); d.setHours(h,0,0,0); return d; };
  for(const c of Object.values(cards)){
    if(!c.nextDate || !hasRemind(c)) continue;
    const m=member(c.memberId).name, title=`${c.subject} — ${m}`, r=Number(c.remindDays);
    if(r>0){ const d=at(addDays(c.nextDate,-r)); if(d>now && d<horizon) out.push({at:d.toISOString(),title,body:`${relLabel(r).replace(/^./,x=>x.toUpperCase())} · ${longDate(c.nextDate)}`,tag:c.id.slice(0,40)+'-r'}); }
    const d=at(c.nextDate); if(d>now && d<horizon) out.push({at:d.toISOString(),title,body:`C'est aujourd'hui · ${cat(c.cat).label}`,tag:c.id.slice(0,40)+'-j'});
  }
  return out;
}
async function getSubscription(create){
  const reg = await navigator.serviceWorker.ready;
  const {publicKey} = await api('/vapid');
  const key=b64uToBytes(publicKey);
  let sub = await reg.pushManager.getSubscription();
  if(sub && sub.options && sub.options.applicationServerKey && !bytesEq(sub.options.applicationServerKey, key.buffer)){ await sub.unsubscribe(); sub=null; }
  if(!sub && create) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:key});
  return sub;
}
let syncTimer=null;
function schedulePushSync(now){
  if(!settings.pushOn || pushState().kind!=='ready' || permission()!=='granted') return;
  clearTimeout(syncTimer); syncTimer=setTimeout(syncPush, now?0:1500);
}
async function syncPush(){
  try{
    const sub = await getSubscription(true);
    if(!settings.deviceId){ settings.deviceId = (crypto.randomUUID?crypto.randomUUID():uid()+uid()).replace(/[^A-Za-z0-9-]/g,''); }
    const res = await api('/sync',{id:settings.deviceId, subscription:sub.toJSON(), reminders:buildReminders()});
    Object.assign(settings,{lastSync:new Date().toISOString(), next:res.next, scheduled:res.scheduled, syncError:null});
  }catch(e){ settings.syncError = e.message || String(e); }
  saveSettings(); refreshNotifSheet();
}
async function enablePush(){
  try{
    const p = await Notification.requestPermission();
    if(p!=='granted'){ toast('Notifications refusées. Voir les réglages ci-dessous.'); refreshNotifSheet(); return; }
    settings.pushOn=true; saveSettings(); await syncPush();
    toast(settings.syncError ? 'Activation incomplète : '+settings.syncError : 'Notifications activées'); renderNotifPip();
  }catch(e){ toast("L'activation a échoué : "+(e.message||e)); }
}
async function disablePush(){
  settings.pushOn=false; saveSettings();
  try{ if(settings.deviceId) await api('/unsubscribe',{id:settings.deviceId}); const reg=await navigator.serviceWorker.ready; const s=await reg.pushManager.getSubscription(); s && await s.unsubscribe(); }catch(e){}
  Object.assign(settings,{next:null,scheduled:0,lastSync:null}); saveSettings(); refreshNotifSheet(); renderNotifPip(); toast('Notifications désactivées');
}
async function testPush(){
  try{ await syncPush(); await api('/test',{id:settings.deviceId}); toast('Notification de test envoyée'); }
  catch(e){ toast("Échec de l'envoi : "+(e.message||e)); }
}

  if(perm==='denied') return `<div class="info-box"><div class="state bad"><i></i>Notifications bloquées</div>Réglages de l'iPhone › <b>Notifications</b> › <b>Carnet</b> › activez « Autoriser les notifications », puis rouvrez l'app.</div>`;
  const hours=[7,8,9,10,12,14,18,19,20].map(h=>`<option value="${h}" ${Number(settings.hour)===h?'selected':''}>${h} h</option>`).join('');

  const next = settings.next ? new Date(settings.next).toLocaleString('fr-FR',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}) : null;
  return `<div class="info-box"><div class="state ${settings.syncError?'bad':'on'}"><i></i>${settings.syncError?'Erreur de synchronisation':'Notifications activées'}</div>
    ${settings.syncError?`<span>${esc(settings.syncError)}</span>`:`<span>${settings.scheduled||0} notification(s) programmée(s)${next?`. Prochaine : <b>${esc(next)}</b>`:''}.</span>`}
    <div class="field"><label for="fHour">Heure des notifications</label><select id="fHour">${hours}</select></div>
    <div class="row-actions"><button class="btn glass" id="bTest" type="button">Envoyer un test</button><button class="btn glass" id="bResync" type="button">Resynchroniser</button><button class="btn glass danger" id="bPushOff" type="button">Désactiver</button></div></div>`;
}
function openNotif(){
  openSheet(`${head('Notifications')}
  <div class="sheet-body help">

    <div><h3>Comment ça marche</h3>

function bindNotif(sheet){

    list.addEventListener('click',e=>{
      const c=e.target.closest('[data-col]'); if(c){ const [i,col]=c.dataset.col.split('|'); draft[i].color=col; draw(); return; }
      const d=e.target.closest('[data-del]'); if(d){ const i=+d.dataset.del, m=draft[i], n=used(m.id);
        if(n && !m._armed){ m._armed=true; m._warn=`${n} fiche(s) concernent ${esc(m.name)}. Elles passeront à « Toute la famille ». Touchez × à nouveau pour confirmer.`; draw(); return; }
        draft.splice(i,1); draw(); }
    });
    sheet.querySelector('#bAddMem').addEventListener('click',()=>{ draft.push({id:'m'+Date.now().toString(36),name:'Nouveau membre',color:MEMBER_COLORS[draft.length%MEMBER_COLORS.length]}); draw(); const inp=list.querySelector(`#mn${draft.length-1}`); inp.focus(); inp.select(); });
    sheet.querySelector('#bExport').addEventListener('click',exportData);
    sheet.querySelector('#bImport').addEventListener('click',()=>document.getElementById('importFile').click());
    sheet.querySelector('#bSaveMem').addEventListener('click',async()=>{
      const clean=draft.map(m=>({id:m.id,name:(m.name||'').trim()||'Sans nom',color:m.color}));
      const ids=new Set(clean.map(m=>m.id));
      const orphans=Object.values(cards).filter(c=>c.memberId!==FAMILY && !ids.has(c.memberId));
      members=clean; await persistMembers();
      for(const c of orphans){ await persistCard(Object.assign({},c,{memberId:FAMILY})); }
      closeSheet(); toast('Membres enregistrés');
    });
  });
}
/* ---------- Rubriques ---------- */
function openCats(){
  let draft = cats.map(c=>Object.assign({},c));
  let open = null; // index de la rubrique dépliée
  const used = id => Object.values(cards).filter(c=>c.cat===id).length;
  openSheet(`${head('Rubriques')}
    <div class="sheet-body">
      <p style="margin:0;color:var(--ink-2)">Créez vos propres rubriques, renommez-les, choisissez une couleur et un pictogramme.</p>
      <div id="catList" style="display:grid;gap:10px"></div>
      <button class="btn glass" id="bAddCat" type="button">${PLUS}Nouvelle rubrique</button>
    </div>
    <div class="sheet-foot"><button class="btn glass" data-close type="button">Annuler</button><button class="btn primary" id="bSaveCats" type="button">Enregistrer</button></div>`, sheet=>{
    const list=sheet.querySelector('#catList');
    const draw=()=>{ list.innerHTML=draft.map((c,i)=>{ const st=`--c:${esc(c.color)};--cbg:color-mix(in srgb,${esc(c.color)} 16%,transparent);--cink:color-mix(in srgb,${esc(c.color)} 58%,#fff)`;
      return `<div class="catrow" style="${st}">
        <div class="mem"><span class="caticon">${icon(c)}</span><label class="sr" for="cn${i}">Nom de la rubrique</label><input id="cn${i}" data-i="${i}" value="${esc(c.label)}" maxlength="32" placeholder="Nom de la rubrique">
          <button class="del" type="button" data-toggle="${i}" aria-expanded="${open===i}" aria-label="Couleur et pictogramme"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="${open===i?'m6 15 6-6 6 6':'m6 9 6 6 6-6'}"/></svg></button>
          <button class="del" type="button" data-del="${i}" aria-label="Supprimer ${esc(c.label)}">×</button></div>
        ${open===i?`<div class="catedit">
          <span class="hint">Couleur</span><div class="mem-colors" style="padding:0">${CAT_COLORS.map(col=>`<button type="button" style="background:${col}" data-col="${i}|${col}" aria-pressed="${c.color===col}" aria-label="Couleur"></button>`).join('')}</div>
          <span class="hint">Pictogramme</span><div class="iconpick">${ICON_NAMES.map(n=>`<button type="button" data-ic="${i}|${n}" aria-pressed="${c.icon===n}" aria-label="${n}">${ICONS[n]}</button>`).join('')}</div>
        </div>`:''}
        ${c._warn?`<div class="warn">${c._warn}</div>`:''}</div>`; }).join(''); };
    draw();
    list.addEventListener('input',e=>{ const i=e.target.dataset.i; if(i!==undefined) draft[i].label=e.target.value; });
    list.addEventListener('click',e=>{
      const t=e.target.closest('[data-toggle]'); if(t){ const i=+t.dataset.toggle; open = open===i?null:i; draw(); return; }
      const c=e.target.closest('[data-col]'); if(c){ const [i,col]=c.dataset.col.split('|'); draft[i].color=col; draw(); return; }
      const ic=e.target.closest('[data-ic]'); if(ic){ const [i,n]=ic.dataset.ic.split('|'); draft[i].icon=n; draw(); return; }
      const d=e.target.closest('[data-del]'); if(d){ const i=+d.dataset.del, k=draft[i], n=used(k.id);
        if(draft.length<=1){ k._warn='Il faut garder au moins une rubrique.'; draw(); return; }
        if(n){ k._warn=`${n} fiche(s) utilisent « ${esc(k.label)} ». Changez leur rubrique avant de la supprimer.`; draw(); return; }
        draft.splice(i,1); if(open===i) open=null; draw(); }
    });
    sheet.querySelector('#bAddCat').addEventListener('click',()=>{
      const usedCols=new Set(draft.map(c=>c.color)); const col=CAT_COLORS.find(c=>!usedCols.has(c))||CAT_COLORS[draft.length%CAT_COLORS.length];
      draft.push({id:'r'+Date.now().toString(36),label:'',color:col,icon:'etoile',subs:[],sugg:[]}); open=draft.length-1; draw();
      const inp=list.querySelector(`#cn${draft.length-1}`); inp.focus(); });
    sheet.querySelector('#bSaveCats').addEventListener('click',async()=>{
      const empty=draft.findIndex(c=>!(c.label||'').trim());
      if(empty>=0){ draft[empty]._warn='Donnez un nom à cette rubrique.'; draw(); list.querySelector(`#cn${empty}`).focus(); return; }
      cats=draft.map(c=>({id:c.id,label:c.label.trim(),color:c.color,icon:c.icon,subs:subsOf(c),sugg:c.sugg||[]}));
      await persistCats(); closeSheet(); toast('Rubriques enregistrées');
    });
  });
}

async function exportData(){
  const name='carnet-famille-'+todayISO()+'.json';
  const data=JSON.stringify({app:'carnet-famille',version:1,exportedAt:new Date().toISOString(),members,cats,cards:Object.values(cards),hist:Object.values(hist)},null,2);
  let dl=null; try{ dl = window.claude ? await window.claude.use('downloads') : null; }catch(e){}
  if(dl){ try{ await dl.save({filename:name,data}); toast('Copie exportée'); }catch(e){ if(e && e.code!=='declined') toast("L'export a échoué."); } return; }
  try{
    const file=new File([data],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Copie du Carnet de famille'}); return; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
  }catch(e){ if(e && e.name!=='AbortError') toast("L'export a échoué."); }
}
document.getElementById('importFile').addEventListener('change',async e=>{
  const file=e.target.files[0]; e.target.value=''; if(!file) return;
  try{
    const raw=JSON.parse(await file.text());
    if(raw.app!=='carnet-famille' || !Array.isArray(raw.cards)) throw new Error('format');
    if(Array.isArray(raw.members) && raw.members.length){ members=raw.members; await persistMembers(); }
    if(Array.isArray(raw.cats) && raw.cats.length){ cats=raw.cats; await persistCats(); }
    for(const c of raw.cards){ if(c && c.id && c.subject) await persistCard(c); }
    if(Array.isArray(raw.hist)) for(const h of raw.hist){ if(h && h.id && h.date) await persistHist(h); }
    closeSheet(); toast(raw.cards.length+' fiche(s) importée(s)');
  }catch(err){ toast("Ce fichier n'est pas une copie du Carnet de famille."); }
});

/* ---------- Toast ---------- */

function toast(msg){ let t=document.querySelector('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t);} t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),3400); }
